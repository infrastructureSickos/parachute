name: Build and Publish Mod

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get version name
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Set version in gradle.properties
        run: |
          sed -i "s/^mod_version=.*/mod_version=${{ steps.version.outputs.name }}/" gradle.properties
          sed -i "s/^modrinth_id=.*/modrinth_id=${{ secrets.MODRINTH_PROJECT_ID }}/" gradle.properties

      - name: Build and publish to Modrinth
        env:
          MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
        run: ./gradlew build modrinth

      - name: Get Modrinth version ID
        id: modrinth
        env:
          MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
        run: |
          VERSION_ID=$(curl -s \
            -H "Authorization: $MODRINTH_API_TOKEN" \
            "https://api.modrinth.com/v2/project/${{ secrets.MODRINTH_PROJECT_ID }}/version?limit=1" \
            | jq -r '.[0].id')
          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT

      - name: Update server modpack
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email "ci@infrastructuresickos.com"
          git config --global user.name "InfrastructureSickos CI"

          git clone "https://x-access-token:${GH_PAT}@github.com/infrastructureSickos/server.git" server-repo
          cd server-repo

          python3 - <<'PYEOF'
          import json

          with open('mods-list.json', 'r') as f:
              mods = json.load(f)

          version_id = "${{ steps.modrinth.outputs.version_id }}"
          project_id = "${{ secrets.MODRINTH_PROJECT_ID }}"

          existing = next((m for m in mods if m.get('name') == 'parachute'), None)
          if existing:
              existing['version_id'] = version_id
              existing['modrinth_project_id'] = project_id
          else:
              mods.append({
                  "name": "parachute",
                  "modrinth_project_id": project_id,
                  "version_id": version_id
              })

          with open('mods-list.json', 'w') as f:
              json.dump(mods, f, indent=2)
          print(f"Updated parachute to version {version_id}")
          PYEOF

          git add mods-list.json
          git commit -m "Update parachute to ${{ steps.version.outputs.name }}

          Co-Authored-By: Paperclip <noreply@paperclip.ing>"
          git push
