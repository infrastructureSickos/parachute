name: Build and Publish Mod

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get version name
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Set version in gradle.properties
        run: |
          sed -i "s/^mod_version=.*/mod_version=${{ steps.version.outputs.name }}/" gradle.properties

      - name: Build
        run: ./gradlew build

      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
        run: ./gradlew modrinth

      - name: Get Modrinth version ID
        id: modrinth
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
        run: |
          VERSION_ID=$(curl -s \
            -H "Authorization: $MODRINTH_API_TOKEN" \
            "https://api.modrinth.com/v2/project/p4XN9Pna/version?limit=1" \
            | jq -r '.[0].id')
          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT

      - name: Trigger modpack update
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MODPACK_DISPATCH_TOKEN }}
          repository: infrastructureSickos/minecraft-modpack
          event-type: parachute-updated
          client-payload: '{"version": "${{ github.ref_name }}"}'
